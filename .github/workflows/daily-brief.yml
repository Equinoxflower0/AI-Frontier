name: Daily Brief

# 每天北京时间 09:00 自动运行（UTC 01:00）。
# GitHub 的定时任务可能有几分钟到半小时的延迟，属正常现象。
# 也可在 Actions 页面手动触发（workflow_dispatch）。

on:
  schedule:
    - cron: "0 1 * * *"   # UTC 01:00 = Beijing 09:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tailwind CSS
        run: npm install --no-fund --no-audit

      - name: Configure git identity
        run: |
          git config user.name "Xiafancai"
          git config user.email "noreply@example.com"

      - name: Run pipeline (fetch -> score -> render -> seo)
        env:
          TZ: Asia/Shanghai
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "[WARN] DEEPSEEK_API_KEY not set, falling back to rule mode"
            python scripts/run_pipeline.py --mode rule
          else
            python scripts/run_pipeline.py --mode llm
          fi

      - name: Publish (commit + push)
        env:
          TZ: Asia/Shanghai
        run: python scripts/publish_site.py
